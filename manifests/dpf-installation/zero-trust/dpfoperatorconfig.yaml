apiVersion: operator.dpu.nvidia.com/v1alpha1
kind: DPFOperatorConfig
metadata:
  name: dpfoperatorconfig
  namespace: dpf-operator-system
spec:
  <DEPLOYMENT_MODE_FIELD>
  <FLANNEL_CONFIG>
  dpuDetector:
    disable: true
  kamajiClusterManager:
    disable: true
  multus:
    disable: true
  cniInstaller:
    # Required from DPF 26.8+ (26.11): ship ovs/rdma/dhcp CNIs to overrides.dpuCNIBinPath.
    # Kept disabled for DPF 26.4.
    disable: <CNI_INSTALLER_DISABLE>
  networking:
    highSpeedMTU: <NODES_MTU>
  overrides:
    dpuCNIBinPath: /var/lib/cni/bin/
    dpuCNIPath: /run/multus/cni/net.d/
    dpuOpenvSwitchSystemSharedLib64Path: /lib64
    dpuLinkerCachePath: /etc/ld.so.cache
    dpuOptLibraryPath: /usr/opt
    flannelSkipCNIConfigInstallation: false
    kubernetesAPIServerPort: 6443
    kubernetesAPIServerVIP: <HOST_CLUSTER_API>
  provisioningController:
    enableDynamicBFCFGTemplates: true
    hostAgentDNSPolicy: Default
    dmsTimeout: 900
    nodeEffectRemovalTimeout: "3600s"
    installInterface:
      installViaRedfish:
        bfbRegistryAddress: "<BFB_REGISTRY_HOST>:<ZT_BFB_REGISTRY_PORT>"
        bfbRegistry:
          port: <ZT_BFB_REGISTRY_PORT>
        skipDPUNodeDiscovery: true
  staticClusterManager:
    disable: false
